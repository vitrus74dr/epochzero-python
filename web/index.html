<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <title>EpochZero Python</title>
    <!-- A prompt glyph in the light theme's --accent (a favicon can't read CSS variables). -->
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='4' fill='%232A7368'/%3E%3Cpath d='M8 10l7 6-7 6M17 23h8' fill='none' stroke='%23fff' stroke-width='3'/%3E%3C/svg%3E" />
    <script>
      // Set data-theme before first paint so there is no flash of the wrong theme.
      // Keep the storage key in sync with src/theme/theme.ts.
      (function () {
        var t = null;
        try { t = localStorage.getItem('epochzero.theme'); } catch (e) {}
        if (t !== 'dark' && t !== 'light') {
          t = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        }
        document.documentElement.setAttribute('data-theme', t);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
