[project]
name = "epochzero-python"
version = "0.1.0"
description = "EpochZero Python: a local-first Python course cockpit with a Claude Code tutor"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "inquirer>=3.4.1",
    "ptyprocess>=0.7.0; sys_platform != 'win32'",
    "pywinpty>=2.0.14; sys_platform == 'win32'",
    "rich>=15.0.0",
    "uvicorn[standard]>=0.32",
]

[project.scripts]
epochzero = "server.main:run"
epochzero-quiz = "server.quiz_cli:main"
epochzero-tutor = "server.tutor_cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "pytest-timeout>=2.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["server"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
timeout = 30
